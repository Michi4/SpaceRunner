        </nav>
    </header>

    <main class="lobby-container">
        <h1>Multiplayer Lobby</h1>

        <!-- View 1: Join/Create Room -->
        <div id="setup-view" class="view">
            <section class="section" aria-labelledby="create-heading">
                <h2 id="create-heading">Create a Room</h2>
                <div class="input-group">
                    <label class="visually-hidden" for="create-room-name">Room name</label>
                    <input type="text" id="create-room-name" placeholder="Enter Room Name" maxlength="20"
                        autocomplete="off" spellcheck="false" pattern="[A-Za-z0-9_\-]{1,20}"
                        title="Letters, numbers, _ or -, max 20 characters">
                    <button id="create-btn" type="button">Create</button>
                </div>
            </section>

            <section class="section" aria-labelledby="rooms-heading">
                <h2 id="rooms-heading">Available Rooms</h2>
                <div class="rooms-list" id="rooms-list-container" role="status" aria-live="polite">
                    <div class="rooms-empty">Connecting to the lobby…</div>
                </div>
            </section>
        </div>

        <!-- View 2: Room Lobby -->
        <div id="lobby-view" class="view" hidden>
            <h2 id="current-room-title">Room: …</h2>

            <section class="section" aria-labelledby="players-heading">
                <h3 id="players-heading">Players</h3>
                <div class="player-list" id="player-badge-container">
                    <!-- Dynamic badges -->
                </div>
            </section>

            <section class="section" id="mode-selector-section" hidden aria-labelledby="mode-heading">
                <h3 id="mode-heading"><label for="game-mode">Select Mode:</label></h3>
                <select id="game-mode">
                    <option value="normal">Normal</option>
                    <option value="easy">Easy</option>
                    <option value="hard">Hard (Score)</option>
                    <option value="impossible">Impossible (Score)</option>
                    <option value="run">Run Mode</option>
                </select>
                <div class="mode-row">
                    <label for="seed-input">Seed:</label>
                    <input type="text" id="seed-input" class="seed-input" placeholder="Random (leave blank)"
                        maxlength="20" autocomplete="off" spellcheck="false">
                    <button id="random-seed-btn" class="random-seed-btn" type="button" title="Random seed">Random</button>
                </div>
                <p class="seed-hint">Seeds only apply to random levels (after level 3). Same seed = same map!</p>
            </section>

            <div class="section lobby-actions">
                <button id="start-game-btn" type="button" disabled>Waiting for Host…</button>
                <button id="leave-btn" class="btn-secondary" type="button">Leave Room</button>
            </div>
        </div>
    </main>

    <p id="loggeduser" aria-live="polite"></p>

    <footer class="site-footer">
        <nav aria-label="Footer">

            <a href="/game">Play</a><span aria-hidden="true"> · </span>
            <a href="/scoreboard">Scores</a><span aria-hidden="true"> · </span>
            <a href="/login/login">Login</a>
        </nav>

    </footer>

</html>
