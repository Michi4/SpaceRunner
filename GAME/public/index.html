    <main id="blur">
        <h1 class="headline"><a href="/" class="home">SpaceRunner</a></h1>

        <div class="btnwrapper">
            <div class="block"><button class="playBtn" onclick="pressedPlay()">Play</button></div>
            <div class="block nomobile" id="coopBtn"><button onclick="pressedCoop()">Coop</button></div>
            <div class="block"><button class="playBtn" onclick="setDifficulty('run')"><span class="tiny-info">SCORE</span>Run Mode</button></div>
            <div class="block noserver" id="multiplayerBtn"><button onclick="pressedMultiplayer()">Multiplayer</button></div>
            <div class="block"><button class="playBtn" onclick="window.location.assign('/scoreboard');">Scores</button></div>
        </div>
        <div id="seed-row" hidden>
            <label for="solo-seed">&#x1F331; Seed:</label>
            <input id="solo-seed" type="text" maxlength="20" placeholder="Leave blank for random" autocomplete="off" spellcheck="false">
            <button type="button" id="seed-random-btn" title="Random seed" aria-label="Generate random seed">&#x1F3B2;</button>
        </div>
        <noscript><p class="noscript-note">SpaceRunner needs JavaScript to run.</p></noscript>
    </main>

    <a class="donate-link" href="https://paypal.me/michaelruep" rel="noopener" title="Support SpaceRunner">
        <span class="donate-heart" aria-hidden="true">♥</span><span>Support</span>
    </a>

    </div>
