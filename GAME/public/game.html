<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Play SpaceRunner – Free Browser Platformer</title>
    <meta name="description" content="Play SpaceRunner free in your browser: tight canvas platforming with seeded runs and online multiplayer. No install needed.">
    <link rel="canonical" href="https://spacerunner.websters.at/game">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#9700bd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SpaceRunner">
    <meta property="og:title" content="Play SpaceRunner – Free Browser Platformer">
    <meta property="og:description" content="Tight canvas platforming with seeded runs and online multiplayer. Free, no install.">
    <meta property="og:url" content="https://spacerunner.websters.at/game">
    <meta property="og:image" content="https://spacerunner.websters.at/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Play SpaceRunner – Free Browser Platformer">
    <meta name="twitter:description" content="Tight canvas platforming with seeded runs and online multiplayer. Free, no install.">
    <meta name="twitter:image" content="https://spacerunner.websters.at/img/og-image.png">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preload" as="font" href="font/Space.ttf" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="./css/style.css?v=2">
    <script src="./js/jquery.min.js?v=2" defer></script>
    <script src="./js/common.js?v=2" defer></script>
    <!-- Socket.io client, loaded only for online multiplayer (no document.write) -->
    <script>
    if (localStorage.getItem('multiplayer') === 'true') {
        var s = document.createElement('script');
        s.src = '/socket.io/socket.io.js';
        s.defer = true;
        document.head.appendChild(s);
    }
    </script>
    <script src="./js/script.js?v=2" defer></script>
</head>
<body>

    <header class="game-header">
        <div class="header-logo"><a href="/" aria-label="SpaceRunner – home"><span class="logo-full">SpaceRunner</span><span class="logo-short" aria-hidden="true">SR</span></a></div>

        <div id="scores" role="status" aria-label="Current score">
            <p id="coins"><img class="coinDispImg" src="./img/coin.png" alt="Coins:" width="24" height="24"> <span id="coin-count">0</span></p>
            <div class="flex score-flex">
                <svg viewBox="0 0 512 512" class="nav-svg score-icon" aria-hidden="true"><path d="M156.6 384.9L125.7 354c-8.5-8.5-11.5-20.8-7.7-32.2c3-8.9 7-20.5 11.8-33.8L24 288c-8.6 0-16.6-4.6-20.9-12.1s-4.2-16.7 .2-24.1l52.5-88.5c13-21.9 36.5-35.3 61.9-35.3l82.3 0c2.4-4 4.8-7.7 7.2-11.3C289.1-4.1 411.1-8.1 483.9 5.3c11.6 2.1 20.6 11.2 22.8 22.8c13.4 72.9 9.3 194.8-111.4 276.7c-3.5 2.4-7.3 4.8-11.3 7.2v82.3c0 25.4-13.4 49-35.3 61.9l-88.5 52.5c-7.4 4.4-16.6 4.5-24.1 .2s-12.1-12.2-12.1-20.9V380.8c-14.1 4.9-26.4 8.9-35.7 11.9c-11.2 3.6-23.4 .5-31.8-7.8zM384 168a40 40 0 1 0 0-80 40 40 0 1 0 0 80z"/></svg>
                <p id="a" class="score"></p>
            </div>
        </div>

        <nav class="header-nav" aria-label="Main navigation">
            <a href="/" class="nav-btn" title="Back to Main Menu">
                <svg viewBox="0 0 576 512" class="nav-svg" aria-hidden="true"><path fill="currentColor" d="M575.8 255.5c0 18-15 32.1-32 32.1h-32v224c0 17.7-14.3 32-32 32H352c-17.7 0-32-14.3-32-32V384H256v128c0 17.7-14.3 32-32 32H112c-17.7 0-32-14.3-32-32V287.6H48c-18 0-32-14.1-32-32.1c0-9 3-17 10-24L265 7c6-6 15-10 23-10s17 4 23 10L565 231.5c7 7 10.8 15 10.8 24z"/></svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="/scoreboard" class="nav-btn" title="Scoreboard">
                <svg viewBox="0 0 512 512" class="nav-svg" aria-hidden="true"><path fill="currentColor" d="M156.6 384.9L125.7 354c-8.5-8.5-11.5-20.8-7.7-32.2c3-8.9 7-20.5 11.8-33.8L24 288c-8.6 0-16.6-4.6-20.9-12.1s-4.2-16.7 .2-24.1l52.5-88.5c13-21.9 36.5-35.3 61.9-35.3l82.3 0c2.4-4 4.8-7.7 7.2-11.3C289.1-4.1 411.1-8.1 483.9 5.3c11.6 2.1 20.6 11.2 22.8 22.8c13.4 72.9 9.3 194.8-111.4 276.7c-3.5 2.4-7.3 4.8-11.3 7.2v82.3c0 25.4-13.4 49-35.3 61.9l-88.5 52.5c-7.4 4.4-16.6 4.5-24.1 .2s-12.1-12.2-12.1-20.9V380.8c-14.1 4.9-26.4 8.9-35.7 11.9c-11.2 3.6-23.4 .5-31.8-7.8zM384 168a40 40 0 1 0 0-80 40 40 0 1 0 0 80z"/></svg>
                <span class="nav-label">Scores</span>
            </a>
            <span id="seed-display" class="seed-display" hidden></span>
            <button id="openmenu" class="nav-btn" onclick="clickmenu()" title="Settings" aria-label="Open settings" aria-haspopup="dialog">
                <svg viewBox="0 0 512 512" class="nav-svg" aria-hidden="true"><path fill="currentColor" d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6l-43.3 75c-3.2 8.7-11.9 14.3-21.2 14.3H383.6l-23 40c-4.7 8.2-13.4 13.3-22.8 13.3H264v-64h-16v64H174.2c-9.4 0-18.1-5.1-22.8-13.3l-23-40H80.7c-9.3 0-18-5.6-21.2-14.3l-43.3-75c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C65.1 273.1 64.5 264.6 64.5 256s.6-17.1 1.7-25.4L22.9 191.2c-6.9-6.2-9.6-15.9-6.4-24.6l43.3-75C63 82.9 71.7 77.3 81 77.3H128.4l23-40c4.7-8.2 13.4-13.3 22.8-13.3H248v64h16V24h73.8c9.4 0 18.1 5.1 22.8 13.3l23 40h47.7c9.3 0 18 5.6 21.2 14.3l43.3 75zM256 320a64 64 0 1 0 0-128 64 64 0 1 0 0 128z"/></svg>
            </button>
            <button id="fullscreen-btn" class="nav-btn" title="Toggle Fullscreen" data-action="fullscreen" aria-label="Toggle fullscreen">
                <svg id="fullscreen-icon" viewBox="0 0 448 512" class="nav-svg" aria-hidden="true"><path fill="currentColor" d="M32 32C14.3 32 0 46.3 0 64v96c0 17.7 14.3 32 32 32s32-14.3 32-32V96h64c17.7 0 32-14.3 32-32s-14.3-32-32-32H32zM288 64c0 17.7 14.3 32 32 32h64v64c0 17.7 14.3 32 32 32s32-14.3 32-32V64c0-17.7-14.3-32-32-32H320c-17.7 0-32 14.3-32 32zm128 288c-17.7 0-32 14.3-32 32v64h-64c-17.7 0-32 14.3-32 32s14.3 32 32 32h96c17.7 0 32-14.3 32-32v-96c0-17.7-14.3-32-32-32zM32 320c-17.7 0-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32H64v-64c0-17.7-14.3-32-32-32z"/></svg>
            </button>
        </nav>
    </header>

    <main id="blur">
        <h1 class="visually-hidden">Play SpaceRunner</h1>
        <div id="audiotags"></div>

        <div class="progressBarWrapper" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressWrapper">
            <div class="w3-light-grey">
                <div id="myBar" class="progressBar"></div>
            </div>
        </div>

        <div id="surface">
            <canvas id="game-canvas">SpaceRunner needs a browser with JavaScript and canvas support.</canvas>
            <div id="touch-controls" hidden>
                <div class="touch-move" role="group" aria-label="Move controls">
                    <button type="button" id="left" class="touch-btn" aria-label="Move left">&#9664;</button>
                    <button type="button" id="right" class="touch-btn" aria-label="Move right">&#9654;</button>
                </div>
                <button type="button" id="mobileJump" class="touch-btn touch-jump" aria-label="Jump">&#10514;</button>
            </div>
        </div>
        <noscript><p class="noscript-note">SpaceRunner needs JavaScript to run.</p></noscript>
    </main>

    <div id="clearMenu"></div>

    <!-- Achievement / notification overlay -->
    <div id="achievement-overlay" class="achievement-overlay" hidden></div>

    <p id="loggeduser" aria-live="polite"></p>
</body>
</html>
