# SpaceRunner on Websters PaaS (Traefik + Let's Encrypt)
# Based on upstream docker-compose.prod.yaml:
#  - no published ports (Traefik routes spacerunner.websters.at -> webserver:80)
#  - webserver joins the external proxy network + internal app network
#  - service names php/node/database are kept: nginx.conf references them
services:
  webserver:
    container_name: spacerunner-nginx
    image: nginx:1.26-alpine
    restart: unless-stopped
    volumes:
      - ./GAME/public:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
      - node
      - database
    networks:
      - spacerunner-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${ROUTER_NAME}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=http"
      - "traefik.http.middlewares.${ROUTER_NAME}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${ROUTER_NAME}.middlewares=${ROUTER_NAME}-redirect"
      - "traefik.http.routers.${ROUTER_NAME}-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}-secure.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls.certresolver=letsencrypt"

  php:
    container_name: spacerunner-php
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./GAME/public:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME:-spacerunner}
      DB_USERNAME: ${DB_USER:-spacerunner}
      DB_PASSWORD: ${DB_PASSWORD:-spacerunner}
    depends_on:
      - database
    networks:
      - spacerunner-network

  node:
    container_name: spacerunner-node
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://${DOMAIN}
    networks:
      - spacerunner-network

  database:
    container_name: spacerunner-db
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-spacerunner}
      MYSQL_DATABASE: ${DB_NAME:-spacerunner}
      MYSQL_USER: ${DB_USER:-spacerunner}
      MYSQL_PASSWORD: ${DB_PASSWORD:-spacerunner}
    networks:
      - spacerunner-network

networks:
  spacerunner-network:
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  db-data:
