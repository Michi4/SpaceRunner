worker_processes auto;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include mime.types;
  default_type application/octet-stream;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  client_max_body_size 16M;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types        text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  # HSTS only when the client-facing scheme is https (Traefik terminates
  # TLS and forwards X-Forwarded-Proto). Never sent over plain http.
  map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=63072000; includeSubDomains; preload";
  }

  server {
    listen 80;
    server_name localhost;
    root  /var/www/html;
    index index.php index.html;
    # Behind Traefik (TLS terminator): emit relative redirects so directory
    # slashes etc. keep the client-facing https:// scheme
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # Static assets – long-lived cache (security headers repeated:
    # nginx does not inherit add_header into location blocks).
    # Images/fonts are content-addressed by deploy and safe as immutable;
    # js/css use must-revalidate so bugfix deploys reach players quickly.
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot|mp3|ogg|webmanifest)$ {
      expires 30d;
      add_header Cache-Control "public, immutable" always;
      add_header X-Frame-Options        "SAMEORIGIN"           always;
      add_header X-Content-Type-Options "nosniff"              always;
      add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
      access_log off;
    }

    location ~* \.(css|js)$ {
      expires 1h;
      add_header Cache-Control "public, must-revalidate" always;
      add_header X-Frame-Options        "SAMEORIGIN"           always;
      add_header X-Content-Type-Options "nosniff"              always;
      add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
      access_log off;
    }

    # Never serve sensitive leftovers, even if one lands in the docroot
    location ~* \.(sql|csv|md|log|bak|env|ini|dist|map)$ {
      deny all;
      access_log off;
      log_not_found off;
    }

    # PHP via php-fpm
    location ~ \.php$ {
      fastcgi_split_path_info ^(.+\.php)(/.+)$;
      fastcgi_pass             php:9000;
      fastcgi_index            index.php;
      include                  fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param PATH_INFO       $fastcgi_path_info;
      fastcgi_intercept_errors      off;
      fastcgi_buffer_size           16k;
      fastcgi_buffers               4 16k;
    }

    # Proxy Socket.IO (multiplayer) to Node
    location ^~ /socket.io/ {
      proxy_pass         http://node:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Unknown paths fall through to =404 (custom page below) instead of a
    # nonexistent /index.php (which would leak a PHP "File not found." body)
    location / {
      try_files $uri $uri/ $uri.html $uri.php$is_args$args =404;
    }

    # Pretty custom 404 page
    error_page 404 /404.html;
    location = /404.html {
      internal;
    }

    # Block dot-files (.env, .git, etc.)
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
